cation</text><text x="221" y="378" fill="#176B4D" font-size="13" font-weight="400">Always</text><text x="38" y="416" fill="#17201D" font-size="14" font-weight="400">Motion &amp; Fitness</text><text x="221" y="416" fill="#176B4D" font-size="13" font-weight="400">Allowed</text><rect x="22" y="475" width="316" height="169" rx="12" fill="white" stroke="none"/><text x="38" y="507" fill="#17201D" font-size="17" font-weight="700">Local-first by default</text><text x="38" y="539" fill="#66736E" font-size="13" font-weight="400">Your parking history, notes,</text><text x="38" y="561" fill="#66736E" font-size="13" font-weight="400">and photos stay on your device.</text><text x="38" y="603" fill="#176B4D" font-size="13" font-weight="600">You choose what to share.</text><rect x="0" y="675" width="360" height="65" rx="0" fill="white" stroke="none"/><text text-anchor="middle" x="45" y="698" fill="#66736E" font-size="18" font-weight="400">⌖</text><text text-anchor="middle" x="45" y="718" fill="#66736E" font-size="10" font-weight="400">Map</text><text text-anchor="middle" x="135" y="698" fill="#66736E" font-size="18" font-weight="400">●</text><text text-anchor="middle" x="135" y="718" fill="#66736E" font-size="10" font-weight="400">My Car</text><text text-anchor="middle" x="225" y="698" fill="#66736E" font-size="18" font-weight="400">≋</text><text text-anchor="middle" x="225" y="718" fill="#66736E" font-size="10" font-weight="400">Activity</text><text text-anchor="middle" x="315" y="698" fill="#176B4D" font-size="18" font-weight="400">⚙</text><text text-anchor="middle" x="315" y="718" fill="#176B4D" font-size="10" font-weight="400">Settings</text></svg>